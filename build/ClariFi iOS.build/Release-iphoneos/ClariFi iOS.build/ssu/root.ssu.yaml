apiVersion: ssu/v1
nlu:
  shortcuts:
    bundleIdentifier: com.kentrologia.ClariFi-iOS
    intents:
    - metadata:
        name: FindRecentTransactionsIntent_0
        title: Find Recent Transactions
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }Show my recent transactions in ${+applicationName}'
          - '{${+prefix} }Find transactions in ${+applicationName}'
    - metadata:
        name: AddTransactionIntent_1
        title: Add Transaction
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }Add a transaction in ${+applicationName}'
          - '{${+prefix} }Log a purchase in ${+applicationName}'
    - metadata:
        name: +negative
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }${+standardAppShortcutNegatives}'
variables:
- name: +applicationName
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
    - ClariFi iOS
- name: +prefix
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
      $ref: ssu://Resources/prefix/en.yaml
- name: +standardAppShortcutNegatives
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
      $ref: ssu://Resources/standardAppShortcutNegatives/en.yaml
